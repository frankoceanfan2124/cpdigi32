<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- The Fully Connected Navbar -->
    <nav class="navbar">
        <div class="logo">Group Management</div>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/terms">Terms</a></li>
            <li><a href="/about">About</a></li>
            <li><a href="/contact">Contact</a></li>
        </ul>
    </nav>

    <main class="content">
        <h1>Contact Support</h1>
        <section class="docs-section">
            <!-- A basic HTML Form -->
            <form action="#" method="POST">
                <p>Email Address:</p>
                <input type="email" name="email" placeholder="you@example.com" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px;">
                
                <p>Message:</p>
                <textarea name="message" rows="4" placeholder="How can we help?" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px;"></textarea>
                
                <button type="submit" style="padding: 10px 20px; background-color: #4daafc; color: white; border: none; border-radius: 5px; cursor: pointer;">Send Message</button>
            </form>
        </section>
    </main>
</body>
</html>
